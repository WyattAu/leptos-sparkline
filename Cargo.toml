[package]
name = "leptos-sparkline"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Sparkline mini-chart component for Leptos — renders tiny line charts on canvas with localStorage persistence"
repository = "https://github.com/WyattAu/leptos-sparkline"
keywords = ["leptos", "sparkline", "canvas", "chart", "metrics"]
categories = ["wasm", "gui", "visualization"]
exclude = ["/target"]

[dependencies]
leptos = { version = "0.8", default-features = false }
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d", "HtmlCanvasElement", "Window",
    "Document", "Element", "Storage", "DomRect",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr"]
default = ["hydrate"]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
